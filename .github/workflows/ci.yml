name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies (wheels only)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "setuptools>=68" wheel
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Smoke test
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/ -q
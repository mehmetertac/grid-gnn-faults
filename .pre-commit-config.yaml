repos:
  - repo: local
    hooks:
      - id: check-file-size
        name: check file size (max 1000 lines)
        entry: python scripts/check_file_size.py
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
